name: Sync Nexview upstream

on:
  schedule:
    # Monthly on the first day, away from the hour when public runners are busiest.
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nexview-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: DerKezorm/nexview
  SYNC_BRANCH: chore/sync-upstream

jobs:
  detect:
    name: Check for upstream changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch canonical Nexview main
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

      - name: Compare histories
        id: compare
        run: |
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains upstream/main."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  merge-test-pr:
    name: Merge, test, and open update PR
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge canonical Nexview main
        id: merge
        env:
          UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          # Capture the exact remote tip before testing; fail rather than
          # overwrite a concurrent update to the automation-owned branch.
          expected=$(git ls-remote origin "refs/heads/$SYNC_BRANCH" | cut -f1)
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          git switch --force-create "$SYNC_BRANCH" main
          if ! git merge --no-edit --no-ff "$UPSTREAM_SHA"; then
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
        run: |
          title="Upstream Nexview sync needs conflict resolution"
          conflicts=$(sed 's/^/- `/' /tmp/conflicts.txt | sed 's/$/`/')
          body=$(printf 'The scheduled merge of `DerKezorm/nexview@%s` into `main` conflicted. No code or image was published.\n\nConflicting files:\n%s\n' "$UPSTREAM_SHA" "$conflicts")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1

      - uses: actions/setup-python@v5
        if: steps.merge.outputs.conflict == 'false'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Test backend after the merge
        if: steps.merge.outputs.conflict == 'false'
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m ruff check app tests tools
          python -m pytest -q

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.conflict == 'false'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend after the merge
        if: steps.merge.outputs.conflict == 'false'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run lint
          npm test

      - name: Push tested sync branch
        if: steps.merge.outputs.conflict == 'false'
        env:
          EXPECTED_SHA: ${{ steps.merge.outputs.expected }}
        run: git push --force-with-lease="refs/heads/$SYNC_BRANCH:$EXPECTED_SHA" origin "$SYNC_BRANCH"

      - name: Create or update the upstream-sync PR
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
        run: |
          number=$(gh pr list --state open --head "$SYNC_BRANCH" --base main --json number --jq '.[0].number // empty')
          body=$(printf 'Automated, tested merge of canonical `DerKezorm/nexview@%s`.\n\nThe workflow merged upstream into the StoffCore branch and ran backend lint/tests plus frontend build/lint/tests. Review and merge this PR to publish the custom image.\n' "$UPSTREAM_SHA")
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "chore: sync Nexview upstream" --body "$body"
          else
            gh pr create --base main --head "$SYNC_BRANCH" --title "chore: sync Nexview upstream" --body "$body"
          fi
